<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="title desc">
<title id="title">Perception chain</title>
<desc id="desc">YOLO-World boxes, ArUco check inside each box, depth lookup, deprojection and publication.</desc>
<defs>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
    <path d="M24 0H0V24" fill="none" stroke="#16213a" stroke-width="1"/>
  </pattern>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<style>
  .t { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; fill: #e6edf3; }
  .s { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; fill: #9aabc8; }
  .d { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; fill: #5d6d8a; }
  .m { font-family: ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; fill: #e6edf3; }
  .ms { font-family: ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; fill: #9aabc8; }
  .b { font-weight: 700; }
  .card { fill: #111a2e; stroke: #26344f; stroke-width: 1.2; }
  
</style>
<rect width="1200" height="560" rx="18" fill="#0b1220"/>
<rect width="1200" height="560" rx="18" fill="url(#grid)" opacity="0.55"/>
<text class="t b" x="40" y="46" font-size="22">Perception: from pixels to a 3-D point the robot can reach</text>
<text class="s" x="40" y="70" font-size="14">vision_node.image_callback() for every colour frame. Scene and intrinsics are an example; the steps and formulas are the code's.</text>
<rect x="40" y="92" width="397" height="298" rx="8" fill="#1a2336" stroke="#26344f"/>
<text class="d" x="48" y="408" font-size="12">/camera/camera/color/image_raw  (640 x 480, example)</text>
