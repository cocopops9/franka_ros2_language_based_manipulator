<line x1="294.2" y1="159.9" x2="321.2" y2="478.4" stroke="#24304a" stroke-width="1"/>
<line x1="258.1" y1="159.5" x2="263.2" y2="477.3" stroke="#24304a" stroke-width="1"/>
<line x1="222.1" y1="159.1" x2="205.3" y2="476.2" stroke="#24304a" stroke-width="1"/>
<line x1="186.2" y1="158.6" x2="147.6" y2="475.1" stroke="#24304a" stroke-width="1"/>
<line x1="150.3" y1="158.2" x2="90.1" y2="474.1" stroke="#24304a" stroke-width="1"/>
<line x1="353.6" y1="188.4" x2="107.3" y2="185.4" stroke="#24304a" stroke-width="1"/>
<line x1="359.4" y1="219.4" x2="99.4" y2="216.0" stroke="#24304a" stroke-width="1"/>
<line x1="366.0" y1="254.1" x2="90.5" y2="250.3" stroke="#24304a" stroke-width="1"/>
<line x1="373.3" y1="293.2" x2="80.4" y2="288.9" stroke="#24304a" stroke-width="1"/>
<line x1="381.7" y1="337.6" x2="69.1" y2="332.7" stroke="#24304a" stroke-width="1"/>
<line x1="391.2" y1="388.4" x2="56.1" y2="382.7" stroke="#24304a" stroke-width="1"/>
<rect x="40" y="92" width="397" height="298" rx="8" fill="none" stroke="#26344f"/>
<rect x="184.0" y="331.0" width="38" height="6" rx="3" fill="#c9d3e3" transform="rotate(-18 203.0 334.0)"/>
<rect x="198.0" y="329.0" width="10" height="10" fill="#0b0f19" stroke="#ffffff" stroke-width="1.6"/><rect x="201.0" y="332.0" width="3" height="5" fill="#ffffff"/>
<rect x="243.5" y="296.0" width="34" height="6" rx="3" fill="#c9d3e3" transform="rotate(-18 260.5 299.0)"/>
<rect x="255.5" y="294.0" width="10" height="10" fill="#0b0f19" stroke="#ffffff" stroke-width="1.6"/><rect x="258.5" y="297.0" width="3" height="5" fill="#ffffff"/>
<rect x="150.2" y="223.2" width="18" height="40" rx="6" fill="#7dd3fc" opacity="0.85"/>
<rect x="154.2" y="217.2" width="10" height="9" rx="2" fill="#94a3b8"/>
<rect x="154.2" y="222.2" width="10" height="10" fill="#0b0f19" stroke="#ffffff" stroke-width="1.6"/><rect x="157.2" y="225.2" width="3" height="5" fill="#ffffff"/>
<rect x="110.8" y="364.5" width="38" height="6" rx="3" fill="#c9d3e3" transform="rotate(-18 129.8 367.5)"/>
<g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0.00000;0.12500;0.31250" dur="16.000s" calcMode="discrete" repeatCount="indefinite"/><rect x="180.0" y="326.0" width="46" height="16" rx="3" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="4 3"/><text class="m" x="180.0" y="322.0" font-size="10.5" style="fill:#ffffff">fork (id 2)</text><rect x="239.5" y="291.0" width="42" height="16" rx="3" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="4 3"/><text class="m" x="239.5" y="287.0" font-size="10.5" style="fill:#ffffff">spoon (id 1)</text><rect x="144.2" y="200.2" width="30" height="54" rx="3" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="4 3"/><text class="m" x="144.2" y="196.2" font-size="10.5" style="fill:#ffffff">bottle (id 0)</text><rect x="106.8" y="359.5" width="46" height="16" rx="3" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="4 3"/><text class="m" x="106.8" y="355.5" font-size="10.5" style="fill:#ffffff">fork (id 2)</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0.00000;0.31250" dur="16.000s" calcMode="discrete" repeatCount="indefinite"/><rect x="180.0" y="326.0" width="46" height="16" rx="3" fill="none" stroke="#ff4d4d" stroke-width="2"/><text class="m b" x="180.0" y="322.0" font-size="10.5" style="fill:#ff4d4d">ARUCO</text><circle cx="203.0" cy="334.0" r="2.6" fill="#ffd60a"/><rect x="239.5" y="291.0" width="42" height="16" rx="3" fill="none" stroke="#ff4d4d" stroke-width="2"/><text class="m b" x="239.5" y="287.0" font-size="10.5" style="fill:#ff4d4d">ARUCO</text><circle cx="260.5" cy="299.0" r="2.6" fill="#ffd60a"/><rect x="144.2" y="200.2" width="30" height="54" rx="3" fill="none" stroke="#ff4d4d" stroke-width="2"/><text class="m b" x="144.2" y="196.2" font-size="10.5" style="fill:#ff4d4d">ARUCO</text><circle cx="159.2" cy="227.2" r="2.6" fill="#ffd60a"/><rect x="106.8" y="359.5" width="46" height="16" rx="3" fill="none" stroke="#4ade80" stroke-width="2"/><text class="m b" x="106.8" y="355.5" font-size="10.5" style="fill:#4ade80">YOLO</text></g>
<rect x="470" y="100" width="330" height="50" rx="10" class="card"/>
<rect x="470" y="100" width="330" height="50" rx="10" fill="#22d3ee" opacity="0"><animate attributeName="opacity" values="0;0.16;0" keyTimes="0.00000;0.12500;0.31250" dur="16.000s" calcMode="discrete" repeatCount="indefinite"/></rect>
<rect x="470" y="100" width="330" height="50" rx="10" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0.00000;0.12500;0.31250" dur="16.000s" calcMode="discrete" repeatCount="indefinite"/></rect>
<circle cx="494" cy="125" r="13" fill="none" stroke="#22d3ee"/><text class="t b" x="494" y="130" font-size="13" text-anchor="middle" style="fill:#22d3ee">1</text>
<text class="t b" x="516" y="121" font-size="14">YOLO-World proposes boxes</text>
<text class="ms" x="516" y="139" font-size="10.5">classes = tools[] (bottle, spoon, fork)</text>
<rect x="470" y="158" width="330" height="50" rx="10" class="card"/>
<rect x="470" y="158" width="330" height="50" rx="10" fill="#22d3ee" opacity="0"><animate attributeName="opacity" values="0;0.16;0" keyTimes="0.00000;0.31250;0.50000" dur="16.000s" calcMode="discrete" repeatCount="indefinite"/></rect>
<rect x="470" y="158" width="330" height="50" rx="10" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0.00000;0.31250;0.50000" dur="16.000s" calcMode="discrete" repeatCount="indefinite"/></rect>
<circle cx="494" cy="183" r="13" fill="none" stroke="#22d3ee"/><text class="t b" x="494" y="188" font-size="13" text-anchor="middle" style="fill:#22d3ee">2</text>
<text class="t b" x="516" y="179" font-size="14">ArUco search inside each box</text>
<text class="ms" x="516" y="197" font-size="10.5">DICT_ARUCO_ORIGINAL, crop = box</text>
<rect x="470" y="216" width="330" height="50" rx="10" class="card"/>
<rect x="470" y="216" width="330" height="50" rx="10" fill="#22d3ee" opacity="0"><animate attributeName="opacity" values="0;0.16;0" keyTimes="0.00000;0.50000;0.65625" dur="16.000s" calcMode="discrete" repeatCount="indefinite"/></rect>
<rect x="470" y="216" width="330" height="50" rx="10" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0.00000;0.50000;0.65625" dur="16.000s" calcMode="discrete" repeatCount="indefinite"/></rect>
<circle cx="494" cy="241" r="13" fill="none" stroke="#22d3ee"/><text class="t b" x="494" y="246" font-size="13" text-anchor="middle" style="fill:#22d3ee">3</text>
<text class="t b" x="516" y="237" font-size="14">Depth at one pixel</text>
<text class="ms" x="516" y="255" font-size="10.5">z = depth[v, u] / 1000 (marker centre)</text>
<rect x="470" y="274" width="330" height="50" rx="10" class="card"/>
<rect x="470" y="274" width="330" height="50" rx="10" fill="#22d3ee" opacity="0"><animate attributeName="opacity" values="0;0.16;0" keyTimes="0.00000;0.65625;0.81250" dur="16.000s" calcMode="discrete" repeatCount="indefinite"/></rect>
<rect x="470" y="274" width="330" height="50" rx="10" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0.00000;0.65625;0.81250" dur="16.000s" calcMode="discrete" repeatCount="indefinite"/></rect>
<circle cx="494" cy="299" r="13" fill="none" stroke="#22d3ee"/><text class="t b" x="494" y="304" font-size="13" text-anchor="middle" style="fill:#22d3ee">4</text>
<text class="t b" x="516" y="295" font-size="14">Pinhole deprojection</text>
<text class="ms" x="516" y="313" font-size="10.5">x = (u-cx) z/fx,  y = (v-cy) z/fy</text>
<rect x="470" y="332" width="330" height="50" rx="10" class="card"/>
<rect x="470" y="332" width="330" height="50" rx="10" fill="#22d3ee" opacity="0"><animate attributeName="opacity" values="0;0.16" keyTimes="0.00000;0.81250" dur="16.000s" calcMode="discrete" repeatCount="indefinite"/></rect>
<rect x="470" y="332" width="330" height="50" rx="10" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0.00000;0.81250" dur="16.000s" calcMode="discrete" repeatCount="indefinite"/></rect>
<circle cx="494" cy="357" r="13" fill="none" stroke="#22d3ee"/><text class="t b" x="494" y="362" font-size="13" text-anchor="middle" style="fill:#22d3ee">5</text>
<text class="t b" x="516" y="353" font-size="14">Publish ARUCO detections only</text>
<text class="ms" x="516" y="371" font-size="10.5">/vision/detected_objects</text>
<rect class="card" x="820" y="100" width="340" height="282" rx="12"/>
<text class="t b" x="838" y="128" font-size="14">Worked example: the marked fork</text>
<g opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0.00000;0.50000" dur="16.000s" calcMode="discrete" repeatCount="indefinite"/><text class="m" x="838" y="160" font-size="12.5">marker centre  u = 263, v = 390</text><text class="m" x="838" y="182" font-size="12.5">depth[390, 263] = 789 mm</text><text class="m" x="838" y="204" font-size="12.5" style="fill:#22d3ee">z = 0.789 m</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0.00000;0.65625" dur="16.000s" calcMode="discrete" repeatCount="indefinite"/><text class="ms" x="838" y="234" font-size="11.5">K: fx = fy = 615, cx = 320, cy = 240</text><text class="m" x="838" y="256" font-size="12.5">x = (263 - 320) * 0.789 / 615 = -0.073</text><text class="m" x="838" y="278" font-size="12.5">y = (390 - 240) * 0.789 / 615 = 0.192</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0.00000;0.81250" dur="16.000s" calcMode="discrete" repeatCount="indefinite"/><text class="ms" x="838" y="308" font-size="11">{&quot;label&quot;: &quot;fork&quot;, &quot;x&quot;: -0.073, &quot;y&quot;: 0.192, &quot;z&quot;: 0.789}</text><text class="s" x="838" y="332" font-size="12">controller: tf2 transform camera_link -> fr3_link0</text><text class="m" x="838" y="356" font-size="12.5" style="fill:#f59e0b">p_base = (0.520, 0.200, -0.070)</text></g>
<text class="d" x="838" y="374" font-size="11">true position used to draw the scene: (0.520, 0.200, -0.070)</text>
<text class="s" x="40" y="442" font-size="13">The unmarked fork is drawn on /debug_image (green) but is not published: only method == ARUCO reaches the controller.</text>
<text class="s" x="40" y="464" font-size="13">Depth is read at a single pixel (no averaging); pixels with depth 0 are discarded by the z_cam &gt; 0 test.</text>
<text class="s" x="40" y="486" font-size="13">Coordinates leave the node in the camera frame; the 3-D transform happens in move_to_pose_node through tf2.</text>
<text class="d" x="40" y="520" font-size="12">Loop: 16 s. Pixel and depth values are computed from the example scene with the calibrated extrinsics of move_robot.launch.py.</text>
</svg>
