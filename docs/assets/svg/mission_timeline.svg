<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="title desc">
<title id="title">Mission scheduling</title>
<desc id="desc">Timeline of the default mission: requested times, dispatch threshold and sequential execution.</desc>
<defs>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
    <path d="M24 0H0V24" fill="none" stroke="#16213a" stroke-width="1"/>
  </pattern>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<style>
  .t { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; fill: #e6edf3; }
  .s { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; fill: #9aabc8; }
  .d { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; fill: #5d6d8a; }
  .m { font-family: ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; fill: #e6edf3; }
  .ms { font-family: ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; fill: #9aabc8; }
  .b { font-weight: 700; }
  .card { fill: #111a2e; stroke: #26344f; stroke-width: 1.2; }
  
</style>
<rect width="1200" height="400" rx="18" fill="#0b1220"/>
<rect width="1200" height="400" rx="18" fill="url(#grid)" opacity="0.55"/>
<text class="t b" x="40" y="46" font-size="22">Scheduling: startTime is a lower bound, not a deadline</text>
<text class="s" x="40" y="70" font-size="14">Default shared/sequence.json. A task may start once elapsed ≥ startTime − 5 s, and only after the previous task has finished.</text>
<line x1="170" y1="330" x2="1150" y2="330" stroke="#5d6d8a"/>
<line x1="223.5" y1="330" x2="223.5" y2="336" stroke="#5d6d8a"/><text class="d" x="223.5" y="352" font-size="11" text-anchor="middle">0 s</text>
<line x1="312.5" y1="330" x2="312.5" y2="336" stroke="#5d6d8a"/><text class="d" x="312.5" y="352" font-size="11" text-anchor="middle">10 s</text>
<line x1="401.6" y1="330" x2="401.6" y2="336" stroke="#5d6d8a"/><text class="d" x="401.6" y="352" font-size="11" text-anchor="middle">20 s</text>
<line x1="490.7" y1="330" x2="490.7" y2="336" stroke="#5d6d8a"/><text class="d" x="490.7" y="352" font-size="11" text-anchor="middle">30 s</text>
<line x1="579.8" y1="330" x2="579.8" y2="336" stroke="#5d6d8a"/><text class="d" x="579.8" y="352" font-size="11" text-anchor="middle">40 s</text>
<line x1="668.9" y1="330" x2="668.9" y2="336" stroke="#5d6d8a"/><text class="d" x="668.9" y="352" font-size="11" text-anchor="middle">50 s</text>
<line x1="758.0" y1="330" x2="758.0" y2="336" stroke="#5d6d8a"/><text class="d" x="758.0" y="352" font-size="11" text-anchor="middle">60 s</text>
<line x1="847.1" y1="330" x2="847.1" y2="336" stroke="#5d6d8a"/><text class="d" x="847.1" y="352" font-size="11" text-anchor="middle">70 s</text>
<line x1="936.2" y1="330" x2="936.2" y2="336" stroke="#5d6d8a"/><text class="d" x="936.2" y="352" font-size="11" text-anchor="middle">80 s</text>
<line x1="1025.3" y1="330" x2="1025.3" y2="336" stroke="#5d6d8a"/><text class="d" x="1025.3" y="352" font-size="11" text-anchor="middle">90 s</text>
<line x1="1114.4" y1="330" x2="1114.4" y2="336" stroke="#5d6d8a"/><text class="d" x="1114.4" y="352" font-size="11" text-anchor="middle">100 s</text>
<defs><clipPath id="run"><rect x="170" y="100" width="0" height="230"><animate attributeName="width" values="0;980;980" keyTimes="0;0.8;1" dur="12.0s" repeatCount="indefinite"/></rect></clipPath></defs>
<text class="t b" x="40" y="136" font-size="14">fork</text><text class="ms" x="40" y="154" font-size="11">startTime 0</text>
<line x1="170" y1="132" x2="1150" y2="132" stroke="#26344f" stroke-dasharray="3 5"/>
<path d="M223.5 120l8 12l-8 12l-8 -12z" fill="#f472b6"/>
<line x1="178.9" y1="114" x2="178.9" y2="150" stroke="#f472b6" stroke-dasharray="3 3"/>
<text class="t b" x="40" y="206" font-size="14">spoon</text><text class="ms" x="40" y="224" font-size="11">startTime 5</text>
<line x1="170" y1="202" x2="1150" y2="202" stroke="#26344f" stroke-dasharray="3 5"/>
<path d="M268.0 190l8 12l-8 12l-8 -12z" fill="#f472b6"/>
<line x1="223.5" y1="184" x2="223.5" y2="220" stroke="#f472b6" stroke-dasharray="3 3"/>
<text class="t b" x="40" y="276" font-size="14">bottle</text><text class="ms" x="40" y="294" font-size="11">startTime 5</text>
<line x1="170" y1="272" x2="1150" y2="272" stroke="#26344f" stroke-dasharray="3 5"/>
<path d="M268.0 260l8 12l-8 12l-8 -12z" fill="#f472b6"/>
<line x1="223.5" y1="254" x2="223.5" y2="290" stroke="#f472b6" stroke-dasharray="3 3"/>
<g clip-path="url(#run)"><rect x="223.5" y="122" width="285.1" height="20" rx="6" fill="#f59e0b" opacity="0.85"/><text class="m" x="231.5" y="136" font-size="11" style="fill:#0b1220">starts at 0 s</text><rect x="508.5" y="192" width="285.1" height="20" rx="6" fill="#f59e0b" opacity="0.85"/><text class="m" x="516.5" y="206" font-size="11" style="fill:#0b1220">starts at 32 s</text><line x1="223.5" y1="226" x2="508.5" y2="226" stroke="#f87171" stroke-width="1.5"/><text class="m" x="366.0" y="240" font-size="11" text-anchor="middle" style="fill:#f87171">waits for the previous task: 32 s later than allowed</text><rect x="793.6" y="262" width="285.1" height="20" rx="6" fill="#f59e0b" opacity="0.85"/><text class="m" x="801.6" y="276" font-size="11" style="fill:#0b1220">starts at 64 s</text><line x1="223.5" y1="296" x2="793.6" y2="296" stroke="#f87171" stroke-width="1.5"/><text class="m" x="508.5" y="310" font-size="11" text-anchor="middle" style="fill:#f87171">waits for the previous task: 64 s later than allowed</text></g>
<line x1="170" y1="104" x2="170" y2="324" stroke="#ffffff" stroke-width="1.5"><animate attributeName="x1" values="170;1150;1150" keyTimes="0;0.8;1" dur="12.0s" repeatCount="indefinite"/><animate attributeName="x2" values="170;1150;1150" keyTimes="0;0.8;1" dur="12.0s" repeatCount="indefinite"/></line>
<path d="M176 372l6 8l-6 8l-6 -8z" fill="#f472b6"/>
<text class="s" x="192" y="385" font-size="12">requested startTime</text>
<line x1="349" y1="372" x2="349" y2="388" stroke="#f472b6" stroke-dasharray="3 3"/>
<text class="s" x="365" y="385" font-size="12">earliest dispatch (startTime − 5 s)</text>
<rect x="628" y="374" width="16" height="12" rx="3" fill="#f59e0b"/>
<text class="s" x="650" y="385" font-size="12">pick-carry-handover cycle (example: 32 s)</text>
<text class="d" x="40" y="380" font-size="12">legend</text>
</svg>
