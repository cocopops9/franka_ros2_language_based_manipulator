<g opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0.00000;0.59912" dur="22.700s" calcMode="discrete" repeatCount="indefinite"/><rect x="520" y="558" width="531" height="24" rx="6" fill="#0e1626" stroke="#26344f"/><text class="m" x="530" y="574" font-size="11.5">Whisper -&gt; &quot;Release.&quot; -&gt; NLU {&quot;action&quot;: &quot;release&quot;, &quot;object&quot;: null} -&gt; lock</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0.00000;0.64758" dur="22.700s" calcMode="discrete" repeatCount="indefinite"/><line x1="530" y1="613" x2="784" y2="613" stroke="#a78bfa" stroke-width="2" marker-end="url(#am-v)" stroke-dasharray="260" stroke-dashoffset="260"><animate attributeName="stroke-dashoffset" values="260;260;0;0" keyTimes="0;0.6476;0.6674;1" dur="22.70s" repeatCount="indefinite"/></line><rect x="534" y="595" width="416" height="18" rx="5" fill="#0b1220" opacity="0.85"/><text class="m" x="540" y="608" font-size="11.5" style="fill:#e6edf3">{&quot;action&quot;:&quot;release&quot;,&quot;object&quot;:null,&quot;allow_execution&quot;:false}</text></g>
