<g opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0.00000;0.21145" dur="22.700s" calcMode="discrete" repeatCount="indefinite"/><line x1="530" y1="298" x2="306" y2="298" stroke="#a78bfa" stroke-width="2" marker-end="url(#am-v)" stroke-dasharray="230" stroke-dashoffset="230"><animate attributeName="stroke-dashoffset" values="230;230;0;0" keyTimes="0;0.2115;0.2313;1" dur="22.70s" repeatCount="indefinite"/></line><rect x="304" y="280" width="306" height="18" rx="5" fill="#0b1220" opacity="0.85"/><text class="m" x="310" y="293" font-size="11.5" style="fill:#e6edf3">{&quot;type&quot;:&quot;final&quot;,&quot;text&quot;:&quot;Pick the bottle.&quot;}</text></g>
