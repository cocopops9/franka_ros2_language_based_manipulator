<g opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0.00000;0.50220" dur="22.700s" calcMode="discrete" repeatCount="indefinite"/><rect x="30" y="486" width="1140" height="26" rx="6" fill="#a78bfa" opacity="0.10"/><text class="t b" x="44" y="504" font-size="13.5">B.  &quot;release&quot; while the arm waits in the release zone</text></g>
