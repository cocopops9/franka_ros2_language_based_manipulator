<g opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0.00000;0.74449" dur="22.700s" calcMode="discrete" repeatCount="indefinite"/><rect x="957" y="663" width="213" height="24" rx="6" fill="#0e1626" stroke="#26344f"/><text class="m" x="967" y="679" font-size="11.5">open_gripper(): width 0.08 m</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0.00000;0.79295" dur="22.700s" calcMode="discrete" repeatCount="indefinite"/><line x1="300" y1="718" x2="524" y2="718" stroke="#a78bfa" stroke-width="2" marker-end="url(#am-v)" stroke-dasharray="230" stroke-dashoffset="230"><animate attributeName="stroke-dashoffset" values="230;230;0;0" keyTimes="0;0.7930;0.8128;1" dur="22.70s" repeatCount="indefinite"/></line><rect x="304" y="700" width="416" height="18" rx="5" fill="#0b1220" opacity="0.85"/><text class="m" x="310" y="713" font-size="11.5" style="fill:#e6edf3">POST /confirm  -&gt; same intent again, allow_execution: true</text></g>
<text class="d" x="40" y="771" font-size="12">The controller only tests msg.data.find("release"); confirmation, the "pick" action and the object field are not used by move_to_pose.cpp. A release heard before the arm reaches the zone is cleared when the wait starts.</text>
</svg>
