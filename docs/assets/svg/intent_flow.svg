<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="title desc">
<title id="title">Voice command flow</title>
<desc id="desc">Sequence of WebSocket, HTTP and ROS messages for a pick command and a release command.</desc>
<defs>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
    <path d="M24 0H0V24" fill="none" stroke="#16213a" stroke-width="1"/>
  </pattern>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<style>
  .t { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; fill: #e6edf3; }
  .s { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; fill: #9aabc8; }
  .d { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; fill: #5d6d8a; }
  .m { font-family: ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; fill: #e6edf3; }
  .ms { font-family: ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; fill: #9aabc8; }
  .b { font-weight: 700; }
  .card { fill: #111a2e; stroke: #26344f; stroke-width: 1.2; }
  
</style>
<rect width="1200" height="760" rx="18" fill="#0b1220"/>
<rect width="1200" height="760" rx="18" fill="url(#grid)" opacity="0.55"/>
<text class="t b" x="40" y="46" font-size="22">From a spoken word to the gripper</text>
<text class="s" x="40" y="70" font-size="14">Messages exactly as produced by hmi_server and read by move_to_pose.cpp. The intent JSON is published before the operator confirms.</text>
