<g opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0.00000;0.30837" dur="22.700s" calcMode="discrete" repeatCount="indefinite"/><line x1="530" y1="368" x2="784" y2="368" stroke="#a78bfa" stroke-width="2" marker-end="url(#am-v)" stroke-dasharray="260" stroke-dashoffset="260"><animate attributeName="stroke-dashoffset" values="260;260;0;0" keyTimes="0;0.3084;0.3282;1" dur="22.70s" repeatCount="indefinite"/></line><rect x="534" y="350" width="492" height="18" rx="5" fill="#0b1220" opacity="0.85"/><text class="m" x="540" y="363" font-size="11.5" style="fill:#e6edf3">{&quot;action&quot;:&quot;pick&quot;,&quot;object&quot;:{&quot;label&quot;:&quot;bottle&quot;},&quot;allow_execution&quot;:false}</text></g>
